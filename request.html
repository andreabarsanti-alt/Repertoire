<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Richiedi una canzone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Audience song-request page (see CLAUDE.md, "Audience requests"). Opened from the QR code shown
  in the app's Live tab: request.html?db=<firebase database host>&g=<profile id>.
  Reads only the public gigs/<g>/info and gigs/<g>/songs nodes (titles and tags — no chords or
  anything else from the repertoire) and can only create requests and hearts (likes, on the Now playing songs); it never
  sees other people's requests, names, messages or like counts. Plain REST, no SDK; polls instead of streaming so a full room
  doesn't use up the free plan's simultaneous-connection limit.
-->
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080b12; --surface: #0d1118; --surface2: #141b26; --border: #1e2a3a;
  --accent: #3d9e8c; --accent2: #c45a5a; --text: #d8e3f0; --text-dim: #6a7f9a;
  --success: #3aaa7e;
  --fd: 'Inter', system-ui, -apple-system, sans-serif;
}
body {
  background: var(--bg); color: var(--text); font-family: var(--fd);
  min-height: 100dvh; font-size: 16px; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  background-image: radial-gradient(ellipse at 50% -10%, rgba(61,158,140,.10) 0%, transparent 55%);
}
.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
header { text-align: center; margin-bottom: 16px; }
header h1 { font-size: 1.6rem; font-weight: 700; color: var(--accent); letter-spacing: -.02em; }
header p { color: var(--text-dim); font-size: 0.9rem; margin-top: 4px; }
.banner {
  text-align: center; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 0.9rem;
  background: rgba(196,90,90,.14); border: 1px solid rgba(196,90,90,.4); color: #ffb0b0;
}
.hidden { display: none !important; }
.hint { text-align: center; color: var(--text-dim); font-size: 0.85rem; margin: 6px 0 4px; }
.loc-hint { text-align: left; font-size: 0.75rem; margin: 0 0 10px; }
#all-titles { margin: 4px 0 18px; }
.view-toggle { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin: 0 0 8px; }
.vt-ico { font-size: 0.8rem; opacity: .45; transition: opacity .2s; }
.vt-ico.on { opacity: 1; }
.vswitch { position: relative; width: 38px; height: 22px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; padding: 0; }
.vswitch span { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); transition: transform .2s; }
.vswitch[aria-checked="true"] span { transform: translateX(16px); }
#bubbles { position: relative; min-height: 120px; margin: 4px 0 18px; }
/* Phone layout: tags as colourful chips flowing in rows instead of a tall column of bubbles. */
#bubbles.chips-mode { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 0; height: auto !important; }
.tchip {
  border: 1px solid rgba(255,255,255,.14); border-radius: 999px; cursor: pointer;
  padding: .55em 1.05em; color: #fff; font: inherit; font-weight: 700; line-height: 1.2;
  text-shadow: 0 1px 4px rgba(0,0,0,.5);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 6px 18px rgba(0,0,0,.45);
}
.tchip:active { transform: scale(.96); }
.search { position: relative; margin: 14px 0 10px; }
#other-btn { margin: 0 0 4px; }
.or-pick { text-align: center; color: var(--text-dim); font-size: 0.9rem; margin: 0 0 10px; }
.search .fi { padding-left: 40px; }
.search::before { content: '🔍'; position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 0.95rem; opacity: .7; pointer-events: none; }
#search-results { margin-bottom: 14px; }
.bubble {
  position: absolute; border-radius: 50%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; padding: 10px;
  cursor: pointer; overflow: hidden; user-select: none; -webkit-user-select: none;
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 10px 30px rgba(0,0,0,.5);
  animation: floatBubble var(--bdur, 4s) ease-in-out infinite;
  transition: transform .2s;
}
.bubble::before {
  content: ''; position: absolute; top: 7%; left: 10%; width: 58%; height: 44%;
  background: radial-gradient(ellipse, rgba(255,255,255,.2) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.bubble:active { transform: scale(1.08) !important; }
@keyframes floatBubble { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.bubble-name { font-weight: 700; line-height: 1.15; max-width: 88%; overflow-wrap: break-word; hyphens: auto; text-shadow: 0 1px 6px rgba(0,0,0,.65); position: relative; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 18px; border: none; border-radius: 10px; cursor: pointer;
  font: inherit; font-size: 0.95rem; font-weight: 600; min-height: 46px;
}
.btn-primary { background: var(--accent); color: #f0fffb; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn:disabled { opacity: .4; }
.btn-wide { width: 100%; }
.center-msg { text-align: center; padding: 70px 16px; color: var(--text-dim); }
.center-msg .big { font-size: 2.6rem; margin-bottom: 12px; }
.center-msg h2 { color: var(--text); font-size: 1.15rem; margin-bottom: 6px; }

/* Bottom sheets */
.sheet-bg {
  position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.7);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  background: var(--surface); width: 100%; max-width: 560px; max-height: 85dvh; overflow-y: auto;
  border-radius: 18px 18px 0 0; border: 1px solid var(--border); border-bottom: none;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  animation: up .2s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sheet-head h2 { font-size: 1.1rem; color: var(--accent); overflow-wrap: anywhere; }
.x { background: none; border: none; color: var(--text-dim); font-size: 1.6rem; line-height: 1; padding: 4px 10px; cursor: pointer; }
.song {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 13px 12px; margin-bottom: 6px; border-radius: 10px; cursor: pointer;
  background: var(--surface2); border: 1px solid var(--border); color: var(--text); font: inherit;
}
.song-title { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.song.played .song-title { opacity: .5; }
.tag { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag.played { color: #8fe0bf; background: rgba(58,170,126,.12); }
.tag.req { color: #ff9a9a; background: rgba(196,90,90,.15); }
.tag.mine { color: var(--accent); background: rgba(61,158,140,.15); }
.fg { margin-bottom: 12px; }
.fg label { display: block; font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
.fi {
  width: 100%; padding: 12px 13px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text); font: inherit; font-size: 16px; /* 16px: no iOS zoom on focus */
}
.fi:focus { outline: none; border-color: var(--accent); }
textarea.fi { resize: vertical; min-height: 70px; }
.form-err { color: #ff9a9a; font-size: 0.85rem; min-height: 1.2em; margin-bottom: 8px; }
.thanks { text-align: center; padding: 16px 4px 6px; }
.thanks .big { font-size: 3rem; margin-bottom: 8px; }
.thanks h2 { color: var(--accent); margin-bottom: 6px; }
.thanks p { color: var(--text-dim); margin-bottom: 18px; }
.gig {
  display: flex; align-items: center; gap: 12px; margin: 0 0 14px; padding: 12px 16px;
  border-radius: 14px; background: var(--surface); border: 1px solid var(--accent);
}
.poster { flex-shrink: 0; width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
.gig.has-poster .gig-icon { display: none; }
.gig-icon { font-size: 1.8rem; line-height: 1; }
.gig-text { display: flex; flex-direction: column; min-width: 0; }
.gig-text b { font-size: 1.05rem; color: var(--accent); overflow-wrap: anywhere; }
.gig-text span { font-size: 0.92rem; color: var(--text); overflow-wrap: anywhere; }
.now {
  margin: 0 0 14px; padding: 10px 14px; border-radius: 14px;
  background: linear-gradient(135deg, rgba(61,158,140,.22), rgba(61,158,140,.06)); border: 1px solid rgba(61,158,140,.55);
}
.now-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
.now-row + .now-row { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px; }
.now-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.now-text small { font-size: 0.7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); }
.now-text b { font-size: 1.1rem; overflow-wrap: anywhere; }
.now-row.prev .now-text b { font-size: 0.95rem; font-weight: 500; opacity: .8; }
.now-eq { display: inline-block; margin-right: 6px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.heart {
  flex-shrink: 0; width: 48px; min-height: 46px; border-radius: 10px; cursor: pointer; font-size: 1.25rem; line-height: 1;
  background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
}
.heart.mini { width: 42px; min-height: 36px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.1rem; margin: -6px -4px -6px 0; }
.heart.on { color: #ff4f8b; border-color: rgba(255,79,139,.5); background: rgba(255,79,139,.1); }
.heart:active { transform: scale(.9); }
.ig {
  display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 14px;
  padding: 14px 16px; border-radius: 14px; text-decoration: none; color: #fff;
  background: linear-gradient(135deg, #f58529, #dd2a7b 50%, #8134af);
  box-shadow: 0 6px 18px rgba(0,0,0,.45);
}
.ig-icon { font-size: 1.8rem; line-height: 1; }
.ig-text { display: flex; flex-direction: column; text-align: left; }
.ig-text b { font-size: 1.05rem; }
.ig-text span { font-size: 0.9rem; opacity: .95; }
.off { text-align: center; padding: 18px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 6px; }
.off .big { font-size: 1.8rem; }
.off h2 { font-size: 1.05rem; margin: 4px 0 2px; }
.off p { color: var(--text-dim); font-size: 0.88rem; }
.sec-h { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; margin: 18px 0 8px; }
.pg { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 8px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font: inherit; cursor: pointer; }
.th { width: 56px; height: 56px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: var(--surface); border: 1px solid var(--border); overflow: hidden; }
.th img { width: 100%; height: 100%; object-fit: cover; }
.past-gig .th { width: 84px; height: 84px; border-radius: 10px; }
.pg .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pg .tx b { color: var(--accent); font-size: 1rem; }
.pg .tx span { font-size: 0.9rem; overflow-wrap: anywhere; }
.pg .tx small { color: var(--text-dim); font-size: 0.78rem; }
.pg .chev { color: var(--text-dim); font-size: 1.3rem; }
.back { background: none; border: none; color: var(--accent); font: inherit; font-weight: 600; padding: 4px 0; margin-bottom: 10px; cursor: pointer; }
.gig.past-gig { border-color: var(--border); }
.gig-text .dim { color: var(--text-dim); font-size: 0.82rem; }
#past-note-btn { margin: 0 0 4px; }
#past-btn { margin-top: 8px; }
.num { color: var(--text-dim); font-size: 0.85rem; min-width: 1.4em; text-align: right; flex-shrink: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Richiedi una canzone</h1>
    <p id="subtitle">Scegli un artista o un genere, oppure cerca una canzone</p>
  </header>
  <div id="gig" class="gig hidden">
    <img id="poster" class="poster hidden" alt="">
    <span class="gig-icon">🎤</span>
    <span class="gig-text"><b id="gig-when"></b><span id="gig-place"></span></span>
  </div>
  <div id="now" class="now hidden"></div>
  <a id="ig" class="ig hidden" target="_blank" rel="noopener">
    <span class="ig-icon">📸</span>
    <span class="ig-text"><b>Filmaci e taggaci!</b><span id="ig-handle"></span></span>
  </a>

  <div id="past" class="hidden"></div>
  <div id="state-msg" class="center-msg"><div class="big">🎵</div><h2>Caricamento…</h2></div>

  <div id="main" class="hidden">
    <div id="closed" class="banner hidden">Le richieste sono chiuse in questo momento — puoi comunque dare un'occhiata</div>
    <button class="btn btn-secondary btn-wide" id="other-btn" onclick="openForm(null)">✎ Chiedi un’altra canzone o scrivici qualcosa</button>
    <p class="or-pick">o scegli tra</p>
    <div class="view-toggle">
      <span class="vt-ico" aria-hidden="true">🏷️</span>
      <button class="vswitch" id="vswitch" role="switch" aria-checked="false" aria-label="Mostra tutte le canzoni" onclick="setUserView(currentView() === 'titles' ? 'tags' : 'titles')"><span></span></button>
      <span class="vt-ico" aria-hidden="true">☰</span>
    </div>
    <div id="bubbles"></div>
    <div id="all-titles" class="hidden"></div>
    <div class="search"><input class="fi" id="song-search" type="search" placeholder="Cerca una canzone…" autocomplete="off" oninput="renderSearch()"></div>
    <div id="search-results" class="hidden"></div>
    <button class="btn btn-secondary btn-wide hidden" id="past-btn" onclick="location.hash='serate'">🗂 Le nostre serate passate</button>
  </div>
</div>

<div class="sheet-bg hidden" id="list-sheet" onclick="if(event.target===this)closeSheet('list-sheet')">
  <div class="sheet">
    <div class="sheet-head"><h2 id="list-title"></h2><button class="x" onclick="closeSheet('list-sheet')" aria-label="Chiudi">×</button></div>
    <div id="list-songs"></div>
  </div>
</div>

<div class="sheet-bg hidden" id="form-sheet" onclick="if(event.target===this)closeSheet('form-sheet')">
  <div class="sheet" id="form-body"></div>
</div>

<script>
'use strict';

// ── Where to read/write: ?db=<host>&g=<gig> ──
const params = new URLSearchParams(location.search);
const GIG = (params.get('g') || '').trim();
// Instagram handle per gig (profile), shown as a "Filmaci e taggaci!" link card.
const INSTAGRAM = { two_of_us: 'twoofus_7478' };
(() => {
  const ig = INSTAGRAM[GIG];
  if (!ig) return;
  const a = document.getElementById('ig');
  a.href = `https://www.instagram.com/${ig}/`;
  document.getElementById('ig-handle').textContent = `Instagram @${ig}`;
  a.classList.remove('hidden');
})();
const DB_BASE = (() => {
  const raw = (params.get('db') || '').trim().replace(/\/+$/, '');
  // Only a Firebase Realtime Database host (or a local test server) — never an arbitrary site.
  if (/^[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/i.test(raw)) return 'https://' + raw;
  if (/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(raw)) return raw;
  return null;
})();
const POLL_MS = 15000;
const COOLDOWN_MS = 20000;
const MINE_KEY = 'rq_mine_' + GIG;
const LAST_KEY = 'rq_last_' + GIG;
const LIKES_KEY = 'rq_likes_' + GIG;

let info = null, songs = [], songsV = null, pollTimer = null, failCount = 0;

const PALETTE = [
  ['rgba(61,158,140,0.82)','rgba(34,108,96,0.72)'],  ['rgba(70,130,180,0.82)','rgba(38,88,140,0.72)'],
  ['rgba(130,80,168,0.82)','rgba(88,46,128,0.72)'],  ['rgba(48,158,108,0.82)','rgba(26,108,70,0.72)'],
  ['rgba(80,148,190,0.82)','rgba(44,100,148,0.72)'], ['rgba(168,80,108,0.82)','rgba(120,40,70,0.72)'],
  ['rgba(58,140,160,0.82)','rgba(30,96,116,0.72)'],  ['rgba(110,80,176,0.82)','rgba(68,42,136,0.72)'],
  ['rgba(46,168,128,0.82)','rgba(24,116,84,0.72)'],  ['rgba(88,126,176,0.82)','rgba(50,82,138,0.72)'],
  ['rgba(176,80,90,0.82)','rgba(130,40,52,0.72)'],   ['rgba(60,150,148,0.82)','rgba(32,100,98,0.72)'],
];

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// Same key mapping the app uses for info.played / info.requested.
function fbKey(id) { return String(id).replace(/[.#$\[\]\/]/g, '_'); }
// Songs this phone asked for ("L'hai chiesta tu"), stored as { r, reqs: {requestId: songId}, ids: [songId] }.
// r is the request round (info.reqRound): Clear requests in the app starts a new one, and marks from
// an older round are dropped. reqs keeps each request's database id, so checkMine can read it back
// (the rules let anyone read a single request by its unguessable id, never the list) and drop the mark
// once the band has deleted it. Marks saved before request ids were kept (a bare array of song ids, or
// { r, ids }) can't be checked, so they are simply dropped. ids is only for this page load: a sent
// request whose id didn't come back is marked until reload.
let mineNoId = [];
function readMine() {
  try {
    const v = JSON.parse(localStorage.getItem(MINE_KEY) || 'null');
    return { r: v?.r || null, reqs: (v && !Array.isArray(v) && typeof v.reqs === 'object' && v.reqs) || {}, ids: mineNoId };
  } catch { return { r: null, reqs: {}, ids: mineNoId }; }
}
function saveMine(m) { mineNoId = m.ids; try { localStorage.setItem(MINE_KEY, JSON.stringify({ r: m.r, reqs: m.reqs })); } catch {} }
function mineState() {
  const m = readMine(), round = info?.reqRound || null;
  if (round && m.r !== round) { const fresh = { r: round, reqs: {}, ids: [] }; saveMine(fresh); return fresh; }
  return m;
}
function getMine() { const m = mineState(); return [...new Set([...m.ids, ...Object.values(m.reqs)])]; }
function addMine(songId, reqId) {
  const m = mineState();
  if (reqId) m.reqs[reqId] = songId; else if (!m.ids.includes(songId)) m.ids.push(songId);
  saveMine(m);
}
// Every MINE_CHECK_MS (on a poll), read back this phone's own song requests; a deleted one (🗑 or
// Clear requests in the app) comes back null and loses its mark. Rules from before this was added
// refuse the read (401): stop checking until the page is reloaded.
const MINE_CHECK_MS = 30000;
let mineChecked = 0, mineCheckOff = false;
async function checkMine() {
  if (mineCheckOff || Date.now() - mineChecked < MINE_CHECK_MS) return;
  mineChecked = Date.now();
  const ids = Object.keys(mineState().reqs);
  if (!ids.length) return;
  let changed = false;
  for (const id of ids) {
    try {
      const r = await fetch(`${DB_BASE}/gigs/${encodeURIComponent(GIG)}/requests/${encodeURIComponent(id)}.json`, { cache: 'no-store' });
      if (r.status === 401 || r.status === 403) { mineCheckOff = true; return; }
      if (!r.ok) continue;
      if (await r.json() === null) {
        const m = readMine();
        if (m.reqs[id] !== undefined) { delete m.reqs[id]; saveMine(m); changed = true; }
      }
    } catch {}
  }
  if (changed && info) render();
}
function lastSent() { try { return +localStorage.getItem(LAST_KEY) || 0; } catch { return 0; } }
function setLastSent() { try { localStorage.setItem(LAST_KEY, String(Date.now())); } catch {} }

function showState(icon, title, text) {
  document.getElementById('main').classList.add('hidden');
  const el = document.getElementById('state-msg');
  el.classList.remove('hidden');
  el.innerHTML = `<div class="big">${icon}</div><h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ''}`;
}

async function getJSON(path) {
  const r = await fetch(`${DB_BASE}/gigs/${encodeURIComponent(GIG)}/${path}.json`, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function poll() {
  clearTimeout(pollTimer);
  try {
    const i = await getJSON('info');
    failCount = 0;
    if (!i) {
      info = null; songs = []; songsV = null;
      loadPoster(); renderNow();
      document.getElementById('gig').classList.add('hidden');
      renderPast();         // past gigs if there are any, else "Nessuna serata in corso"
      loadPast();
    } else {
      if (i.songsV !== songsV || !songs.length) {
        const list = await getJSON('songs');
        songs = Array.isArray(list) ? list.filter(Boolean) : Object.values(list || {});
        songsV = i.songsV;
      }
      info = i;
      loadPast();
      loadPoster();
      checkMine();
      render();
    }
  } catch {
    failCount++;
    if (!info) showState('📡', 'Impossibile raggiungere il servizio', 'Controlla la connessione — nuovo tentativo in corso…');
  }
  if (!document.hidden) pollTimer = setTimeout(poll, failCount ? Math.min(60000, POLL_MS * (failCount + 1)) : POLL_MS);
}

// ── Visit counter: gigs/<gig>/visits/<phone id> = { first, last, n } ──
// One random id per phone (localStorage); a visit is a page open (or a return to it) at least
// VISIT_GAP_MS after the last one counted on this phone. Only the band can list the visits;
// the phone reads its own node (by its unguessable id) to send n + 1, as the rules require.
const VID_KEY = 'rq_vid_' + GIG, VISIT_KEY = 'rq_visit_' + GIG, VISIT_GAP_MS = 30 * 60000;
let visitBusy = false, memVid = null;
// This phone's random id (also used for its likes); kept in memory if storage is blocked.
function phoneId() {
  let vid = memVid;
  try { vid = localStorage.getItem(VID_KEY) || vid; } catch {}
  if (!/^[A-Za-z0-9_-]{16,40}$/.test(vid || '')) {
    const b = crypto.getRandomValues(new Uint8Array(16));
    vid = btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    try { localStorage.setItem(VID_KEY, vid); } catch {}
  }
  return (memVid = vid);
}
async function countVisit() {
  if (visitBusy || !DB_BASE || !GIG) return;
  let last = 0;
  try { last = +localStorage.getItem(VISIT_KEY) || 0; } catch {}
  if (Date.now() - last < VISIT_GAP_MS) return;
  const vid = phoneId();
  visitBusy = true;
  const url = `${DB_BASE}/gigs/${encodeURIComponent(GIG)}/visits/${vid}.json`;
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) return;          // rules from before the counter: nothing to do
    const cur = await r.json();
    const ts = { '.sv': 'timestamp' };
    const w = await fetch(url, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ first: cur && typeof cur.first === 'number' ? cur.first : ts, last: ts, n: (cur && +cur.n || 0) + 1 }),
    });
    if (w.ok) try { localStorage.setItem(VISIT_KEY, String(Date.now())); } catch {}
  } catch {} finally { visitBusy = false; }
}

// ── Likes (hearts): gigs/<gig>/likes/<song key>/<phone id> = true ──
// Only the Now playing card has hearts (the current and the earlier songs shown there — Andrea).
// Only the band can read the counts; this phone remembers its own hearts as { r, ids: [songId] },
// where r is the like round (info.likeRound): resetting the likes (or Clear requests) in the app
// starts a new round and the hearts empty here too.
function likeState() {
  let v = null;
  try { v = JSON.parse(localStorage.getItem(LIKES_KEY) || 'null'); } catch {}
  const round = info?.likeRound || null;
  const st = { r: v?.r || null, ids: Array.isArray(v?.ids) ? v.ids : [] };
  if (round && st.r !== round) { st.r = round; st.ids = []; saveLikes(st); }
  return st;
}

function isLiked(id) { return likeState().ids.includes(id); }
const likeBusy = new Set();
async function toggleLike(id, ev) {
  ev?.stopPropagation();
  if (!info || likeBusy.has(id)) return;
  const st = likeState(), on = !st.ids.includes(id);
  st.ids = on ? [...st.ids, id] : st.ids.filter(x => x !== id);
  saveLikes(st); render();
  likeBusy.add(id);
  try {
    const url = `${DB_BASE}/gigs/${encodeURIComponent(GIG)}/likes/${encodeURIComponent(fbKey(id))}/${phoneId()}.json`;
    const r = await fetch(url, on ? { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: 'true' } : { method: 'DELETE' });
    if (!r.ok) throw 0;
  } catch {
    // Not saved (offline, or rules without likes): put the heart back as it was.
    const back = likeState();
    back.ids = on ? back.ids.filter(x => x !== id) : [...back.ids, id];

}

// Circle packing — the same approach as the app's Visualizer (largest first, each new circle at
// the free spot closest to the centre), then scaled down to fit the phone's width.
function twoCircleIntersect(x1, y1, r1, x2, y2, r2) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy);
  if (d > r1 + r2 || d < Math.abs(r1 - r2) || d < 1e-9) return [];
  const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  const mx = x1 + a * dx / d, my = y1 + a * dy / d;
  return [{ x: mx + h * dy / d, y: my - h * dx / d }, { x: mx - h * dy / d, y: my + h * dx / d }];
}
function packBubbles(items, xWeight = 1, halfW = Infinity) {
  if (!items.length) return;
  items.sort((a, b) => b.r - a.r);
  items[0].x = 0; items[0].y = 0;
  const GAP = 6;
  for (let i = 1; i < items.length; i++) {
    const c = items[i], placed = items.slice(0, i), cands = [];
    for (const p of placed) {
      const d = p.r + c.r + GAP;
      for (let a = 0; a < 32; a++) { const an = a / 32 * Math.PI * 2; cands.push({ x: p.x + d * Math.cos(an), y: p.y + d * Math.sin(an) }); }
    }
    for (let a = 0; a < placed.length; a++) for (let b = a + 1; b < placed.length; b++)
      cands.push(...twoCircleIntersect(placed[a].x, placed[a].y, placed[a].r + c.r + GAP, placed[b].x, placed[b].y, placed[b].r + c.r + GAP));
    let best = null, bestD = Infinity;
    for (const cand of cands) {
      let ok = true;
      if (Math.abs(cand.x) + c.r > halfW) ok = false;   // keep the cluster within the screen width
      if (ok) for (const p of placed) if (Math.hypot(cand.x - p.x, cand.y - p.y) < p.r + c.r + GAP - 0.5) { ok = false; break; }
      // Width counts more than height: on a phone the cluster grows downwards (the page scrolls)
      // instead of sideways, so it doesn't have to be shrunk to fit the screen width.
      if (ok) { const d = Math.hypot(cand.x * xWeight, cand.y); if (d < bestD) { bestD = d; best = cand; } }
    }
    c.x = best ? best.x : i * (c.r * 2 + GAP); c.y = best ? best.y : 0;
  }
}
let lastBubbleSig = '';
function renderBubbles() {
  const wrap = document.getElementById('bubbles');
  const g = groups(), keys = Object.keys(g).sort();
  const sig = JSON.stringify([keys.map(k => [k, g[k].length]), wrap.clientWidth]);
  if (sig === lastBubbleSig) return;    // unchanged: don't restart the float animation on every poll
  lastBubbleSig = sig;
  if (!keys.length) { wrap.innerHTML = ''; wrap.style.height = ''; return; }
  const max = Math.max(...keys.map(k => g[k].length));
  if ((wrap.clientWidth || window.innerWidth) < 600) {
    // Phone: chips in rows, biggest tags first, text size by song count.
    wrap.classList.add('chips-mode'); wrap.style.height = '';
    wrap.innerHTML = keys.map((key, i) => ({ key, i, n: g[key].length }))
      .sort((a, b) => b.n - a.n || a.key.localeCompare(b.key))
      .map(c => {
        const [c1, c2] = PALETTE[c.i % PALETTE.length];
        const fs = (1 + 0.45 * (c.n / max)).toFixed(2);
        return `<button class="tchip" data-key="${esc(c.key)}" onclick="openList(this.dataset.key)"
          style="font-size:${fs}rem;background:linear-gradient(160deg, ${c1}, ${c2})">${esc(c.key)}</button>`;
      }).join('');
    return;
  }
  wrap.classList.remove('chips-mode');
  // Sized from the screen width, so even the smallest bubble's label stays big enough to read.
  const W0 = wrap.clientWidth || (window.innerWidth - 32);
  const minR = Math.max(58, Math.min(80, W0 * 0.17)), addR = Math.min(70, W0 * 0.12);
  const items = keys.map((key, i) => ({ key, i, count: g[key].length, r: Math.round(minR + (g[key].length / max) * addR) }));
  packBubbles(items, W0 < 600 ? 2.4 : 1, (W0 - 2 * 8) / 2);
  const PAD = 8;
  const minX = Math.min(...items.map(c => c.x - c.r)), maxX = Math.max(...items.map(c => c.x + c.r));
  const minY = Math.min(...items.map(c => c.y - c.r)), maxY = Math.max(...items.map(c => c.y + c.r));
  const W = wrap.clientWidth || (window.innerWidth - 32);
  const scale = Math.min(1, (W - 2 * PAD) / (maxX - minX));
  const offX = PAD + Math.max(0, (W - 2 * PAD - (maxX - minX) * scale) / 2);
  wrap.style.height = Math.ceil((maxY - minY) * scale + 2 * PAD + 8) + 'px';
  wrap.innerHTML = items.map(c => {
    const [c1, c2] = PALETTE[c.i % PALETTE.length];
    const size = Math.round(c.r * 2 * scale);
    const left = Math.round(offX + (c.x - c.r - minX) * scale), top = Math.round(PAD + 8 + (c.y - c.r - minY) * scale);
    const fs = Math.max(0.95, Math.min(1.35, size / 110));
    return `<div class="bubble" data-key="${esc(c.key)}" onclick="openList(this.dataset.key)"
      style="width:${size}px;height:${size}px;left:${left}px;top:${top}px;
             background:radial-gradient(circle at 38% 38%, ${c1}, ${c2});
             --bdur:${(3.4 + (c.i % 7) * 0.38).toFixed(2)}s;animation-delay:${-((c.i * 0.41) % 4)}s">
      <span class="bubble-name" style="font-size:${fs}rem">${esc(c.key)}</span>
    </div>`;
  }).join('');
}

// Song search: matches titles and tags; while it has text, the results replace the bubbles.

// The phone's position, sent with the request so the band can tell a request from the room
// from one sent from far away. Optional: refused, unavailable or slow just means no location.
function getLoc() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    const done = v => { clearTimeout(t); resolve(v); };
    const t = setTimeout(() => resolve(null), 10000);
    navigator.geolocation.getCurrentPosition(
      p => done({ lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5), acc: Math.round(p.coords.accuracy || 0) }),
      () => done(null),
      { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
  });
}

  const name = (document.getElementById('rq-name').value || '').trim().slice(0, 40);

  if (!formSongId && !text) { err.textContent = 'Scrivi una canzone o un messaggio'; return; }
  const wait = COOLDOWN_MS - (Date.now() - lastSent());
  if (wait > 0) { err.textContent = `Un attimo — puoi inviarne un\'altra tra ${Math.ceil(wait / 1000)} s`; return; }
  const body = { at: { '.sv': 'timestamp' } };
  if (formSongId) body.songId = formSongId; else body.text = text;
  if (name) body.name = name;
  if (msg) body.msg = msg;
  saveName(name);
  btn.disabled = true; err.textContent = '';
  const label = btn.textContent; btn.textContent = 'Invio…';
  const loc = await getLoc();
  if (loc) body.loc = loc;
  const post = b => fetch(`${DB_BASE}/gigs/${encodeURIComponent(GIG)}/requests.json`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b),
  });
  let reqId = null;
  try {
    let r = await post(body);
    // Database rules from before locations were added refuse the extra field: send it without.
    if (!r.ok && body.loc) { delete body.loc; r = await post(body); }
    // Rules from before free text could be 200 chars cap `text` at 100: send the first 100 as
    // `text` and the whole thing as `msg` (the app shows just the message when it starts with the text).
    if (!r.ok && body.text && body.text.length > 100) { body.msg = body.text; body.text = body.text.slice(0, 100); r = await post(body); }
    if (r.status === 401 || r.status === 403) { err.textContent = 'Le richieste sono chiuse in questo momento'; btn.disabled = false; btn.textContent = label; poll(); return; }
    if (!r.ok) throw new Error();
    reqId = (await r.json().catch(() => null))?.name || null;
  } catch {
    err.textContent = 'Invio non riuscito — controlla la connessione e riprova';
    btn.disabled = false; btn.textContent = label; return;
  }
  setLastSent();
  if (formSongId) {
    addMine(formSongId, reqId);
    // Show it as requested in the song lists straight away; the next poll brings the real count.
    const s = songById(formSongId);
    if (s && info) { info.requested = info.requested || {}; const k = s.k || fbKey(s.id); info.requested[k] = (+info.requested[k] || 0) + 1; render(); }
  }
  document.getElementById('form-body').innerHTML = formSongId
    ? `<div class="thanks"><div class="big">🙌</div><h2>Richiesta inviata!</h2>
    <p>Grazie — la band la vede già. Niente promesse, ma faremo del nostro meglio.</p>
    <button class="btn btn-primary btn-wide" onclick="closeSheet('form-sheet')">Torna alle canzoni</button></div>`
    : `<div class="thanks"><div class="big">🙌</div><h2>Inviato!</h2>
    <p>Grazie — la band lo vede già.</p>
    <button class="btn btn-primary btn-wide" onclick="closeSheet('form-sheet')">Torna alle canzoni</button></div>`;
}

// ── Past gigs (Andrea, 2026-11-27): shown while nothing is published ──
// gigs/<gig>/past/<id> = { at, place, band, songs: [{id, k, t}], posterV } (public), image in
// pastPoster/<id>. Tapping a gig (#serata=<id>, so the phone's Back works) shows its songs with a
// heart each (pastLikes/<id>/<song key>/<phone id> = true) and a box for a comment
// (pastNotes/<id>/<push id> = { text, name?, at }). Only the band can read the counts and comments;
// this phone remembers its own hearts in rq_plikes_<gig> = { <id>: [songId] }.
const PAST_MS = 5 * 60000, PLIKES_KEY = 'rq_plikes_' + GIG;
let past = null, pastAt = 0, pastBusy = false;
const pastPosters = {};   // id -> { v, img }
async function loadPast(force) {
  if (pastBusy || (!force && past && Date.now() - pastAt < PAST_MS)) return;
  pastBusy = true;
  try { past = (await getJSON('past')) || {}; pastAt = Date.now(); }
  catch { if (!past) past = {}; }   // older rules refuse it: just no past gigs
  finally { pastBusy = false; }
  if (!info) renderPast(); else render();
}
function pastList() {
  return Object.entries(past || {}).filter(([, g]) => g && g.at)
    .map(([id, g]) => ({ id, ...g, songs: (Array.isArray(g.songs) ? g.songs : Object.values(g.songs || {})).filter(Boolean) }))
    .sort((a, b) => b.at - a.at);
}
function pastDate(at) {
  const d = new Date(at);
  const s = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', ...(d.getFullYear() !== new Date().getFullYear() ? { year: 'numeric' } : {}) });
  return s[0].toUpperCase() + s.slice(1);
}
async function loadPastPoster(g) {
  const p = pastPosters[g.id];
  if (!g.posterV || (p && p.v === g.posterV)) return;
  pastPosters[g.id] = { v: g.posterV, img: '' };
  try {
    const j = await getJSON('pastPoster/' + encodeURIComponent(g.id));
    const img = j && typeof j.img === 'string' && j.img.startsWith('data:image/jpeg;base64,') ? j.img : '';
    if (!img) throw 0;
    pastPosters[g.id].img = img;
    document.querySelectorAll(`[data-poster="${CSS.escape(g.id)}"]`).forEach(el => { el.innerHTML = `<img src="${img}" alt="">`; el.classList.add('img'); });
  } catch { delete pastPosters[g.id]; }
}
function pastThumb(g) {
  const img = pastPosters[g.id]?.img;
  return `<span class="th${img ? ' img' : ''}" data-poster="${esc(g.id)}">${img ? `<img src="${img}" alt="">` : '🎤'}</span>`;
}
// While a gig is published with requests closed, the past gigs open from the button at the bottom
// (#serate, #serata=<id>); while requests are open there's no way to them (Andrea).
function pastMode() { return !!info && info.open !== true && /^#serat[ae]/.test(location.hash); }
function pastSel() { const m = /^#serata=(.+)$/.exec(location.hash); return m ? decodeURIComponent(m[1]) : null; }
function pLikes() { try { return JSON.parse(localStorage.getItem(PLIKES_KEY) || '{}') || {}; } catch { return {}; } }
function pLiked(id, sid) { return (pLikes()[id] || []).includes(sid); }
const pLikeBusy = new Set();
async function togglePastLike(id, sid) {
  const key = id + '|' + sid;
  if (pLikeBusy.has(key)) return;
  const set = list => { const all = pLikes(); all[id] = list; if (!list.length) delete all[id]; try { localStorage.setItem(PLIKES_KEY, JSON.stringify(all)); } catch {} };
  const cur = pLikes()[id] || [], on = !cur.includes(sid);
  set(on ? [...cur, sid] : cur.filter(x => x !== sid)); renderPast();
  pLikeBusy.add(key);
  try {
    const url = `${DB_BASE}/gigs/${encodeURIComponent(GIG)}/pastLikes/${encodeURIComponent(id)}/${encodeURIComponent(fbKey(sid))}/${phoneId()}.json`;
    const r = await fetch(url, on ? { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: 'true' } : { method: 'DELETE' });
    if (!r.ok) throw 0;
  } catch {
    const back = pLikes()[id] || [];
    set(on ? back.filter(x => x !== sid) : [...back, sid]); renderPast();
  } finally { pLikeBusy.delete(key); }
}
function renderPast() {
  const box = document.getElementById('past');
  const list = pastList();
  const mode = pastMode();
  ['main', 'gig', 'now'].forEach(id => { if (mode) document.getElementById(id).classList.add('hidden'); });
  if ((info && !mode) || !list.length) {
    box.classList.add('hidden'); box.innerHTML = '';
    if (mode) { if (past !== null) location.hash = ''; return; }   // not loaded yet: wait for loadPast
    if (!info) showState('🌙', 'Nessuna serata in corso', 'Le richieste si aprono quando la band suona — riprova più tardi.');
    return;
  }
  document.getElementById('state-msg').classList.add('hidden');
  box.classList.remove('hidden');
  const band = (info && info.title) || list[0].band || '';
  document.getElementById('title').textContent = band || 'Richiedi una canzone';
  document.title = band || 'Richiedi una canzone';
  const sel = pastSel(), g = sel && list.find(x => x.id === sel);
  if (!g) {
    document.getElementById('subtitle').textContent = 'Le nostre ultime serate';
    box.innerHTML = (mode ? `<button class="back" onclick="location.hash=''">‹ Torna alla serata di stasera</button>`
      : `<div class="off"><div class="big">🌙</div><h2>Nessuna serata in corso</h2><p>Le richieste si aprono quando suoniamo. Intanto guarda cosa abbiamo suonato!</p></div>`) + `
      <div class="sec-h">Serate passate</div>
      ${list.map(x => `<button class="pg" onclick="location.hash='serata=${encodeURIComponent(x.id)}'">${pastThumb(x)}
        <span class="tx"><b>${esc(pastDate(x.at))}</b>${x.place ? `<span>📍 ${esc(x.place)}</span>` : ''}<small>${x.songs.length} canzoni</small></span><span class="chev">›</span></button>`).join('')}`;
    list.forEach(loadPastPoster);
    return;
  }
  document.getElementById('subtitle').textContent = 'Metti un ❤ alle canzoni che ti sono piaciute';
  box.innerHTML = `<button class="back" onclick="location.hash='${mode ? 'serate' : ''}'">‹ Serate passate</button>
    <div class="gig past-gig">${pastThumb(g)}<span class="gig-text"><b>${esc(pastDate(g.at))}</b>${g.place ? `<span>📍 ${esc(g.place)}</span>` : ''}<span class="dim">${g.songs.length} canzoni suonate</span></span></div>
    <button class="btn btn-secondary btn-wide" id="past-note-btn" onclick="openPastForm('${esc(g.id)}')">✎ Com’è andata? Scrivici qualcosa</button>
    <p class="or-pick">o metti un ❤ alle canzoni che ti sono piaciute</p>
    ${g.songs.map((s, i) => { const on = pLiked(g.id, s.id);
      return `<button class="song" onclick="togglePastLike('${esc(g.id)}', '${esc(s.id)}')" aria-pressed="${on}"><span class="num">${i + 1}</span><span class="song-title">${esc(s.t)}</span><span class="heart mini${on ? ' on' : ''}" aria-hidden="true">${on ? '❤' : '♡'}</span></button>`; }).join('')}`;
  loadPastPoster(g);
}
addEventListener('hashchange', () => { if (info) render(); else renderPast(); scrollTo(0, 0); });
let pastFormId = null;
function openPastForm(id) {
  const g = pastList().find(x => x.id === id);
  if (!g) return;
  pastFormId = id;
  document.getElementById('form-body').innerHTML = `
    <div class="sheet-head"><h2>Scrivici qualcosa</h2><button class="x" onclick="closeSheet('form-sheet')" aria-label="Chiudi">×</button></div>
    <p class="hint" style="margin:-4px 0 12px">${esc(pastDate(g.at))}${g.place ? ' · ' + esc(g.place) : ''}</p>
    <div class="fg"><label>Un commento, un saluto, una canzone per la prossima volta…</label><textarea class="fi" id="pn-text" maxlength="200" placeholder="es. Bellissima serata!"></textarea></div>
    <div class="fg"><label>Il tuo nome (facoltativo)</label><input class="fi" id="pn-name" maxlength="40" autocomplete="given-name" value="${esc(savedName())}"></div>
    <div class="form-err" id="pn-err"></div>
    <button class="btn btn-primary btn-wide" id="pn-send" onclick="sendPastNote()">Invia</button>`;
  document.getElementById('form-sheet').classList.remove('hidden');
  setTimeout(() => document.getElementById('pn-text')?.focus(), 50);
}
async function sendPastNote() {
  const err = document.getElementById('pn-err'), btn = document.getElementById('pn-send');
  const text = (document.getElementById('pn-text').value || '').trim().slice(0, 200);
  const name = (document.getElementById('pn-name').value || '').trim().slice(0, 40);
  if (!text) { err.textContent = 'Scrivi qualcosa'; return; }
  const wait = COOLDOWN_MS - (Date.now() - lastSent());
  if (wait > 0) { err.textContent = `Un attimo — puoi scrivere di nuovo tra ${Math.ceil(wait / 1000)} s`; return; }
  const body = { text, at: { '.sv': 'timestamp' } };
  if (name) body.name = name;
  saveName(name);
  btn.disabled = true; err.textContent = ''; btn.textContent = 'Invio…';
  try {
    const r = await fetch(`${DB_BASE}/gigs/${encodeURIComponent(GIG)}/pastNotes/${encodeURIComponent(pastFormId)}.json`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    if (!r.ok) throw 0;
  } catch {
    err.textContent = 'Invio non riuscito — controlla la connessione e riprova';
    btn.disabled = false; btn.textContent = 'Invia'; return;
  }
  setLastSent();
  document.getElementById('form-body').innerHTML = `<div class="thanks"><div class="big">🙌</div><h2>Grazie!</h2>
    <p>La band lo leggerà presto.</p>
    <button class="btn btn-primary btn-wide" onclick="closeSheet('form-sheet')">Torna alla serata</button></div>`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet('form-sheet'); closeSheet('list-sheet'); }
});

if (!DB_BASE || !GIG) showState('🤔', 'Link incompleto', 'Scansiona di nuovo il codice QR, o chiedi il link alla band.');
else { poll(); countVisit(); }
</script>
</body>
